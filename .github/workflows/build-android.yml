name: Android APK Build

on:
  push:
    branches:
      - claude/homework-assistant-groq-ti5ff5
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── Kaynak kodu al ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Node.js ─────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── Java 17 ─────────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ─── Android SDK ─────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools & NDK
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" "ndk;26.1.10909125" || true

      # ─── npm bağımlılıkları ───────────────────────────────────────
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # ─── Groq API Key + Backend URL enjeksiyonu ──────────────────
      - name: Inject secrets into config
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python3 << 'EOF'
          import os

          groq_key = os.environ.get('GROQ_API_KEY', '')
          api_url  = os.environ.get('API_BASE_URL', '')

          if not groq_key:
              print("WARNING: GROQ_API_KEY secret is not set!")
          if not api_url:
              print("WARNING: API_BASE_URL secret is not set!")
          else:
              print(f"API URL: {api_url}")

          filepath = 'src/config/defaults.ts'
          with open(filepath, 'r') as f:
              content = f.read()

          content = content.replace('GROQ_KEY_PLACEHOLDER', groq_key)
          content = content.replace('API_URL_PLACEHOLDER', api_url)

          with open(filepath, 'w') as f:
              f.write(content)

          print("Secrets injected.")
          EOF

      # ─── Expo prebuild (native Android kodu üret) ─────────────────
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: 1

      # ─── Kotlin sürümü düzelt ────────────────────────────────────────
      - name: Print build.gradle for debugging
        run: |
          echo "=== android/build.gradle ==="
          cat android/build.gradle || true

      - name: Patch Kotlin version to 1.9.25
        run: |
          python3 << 'PYEOF'
          import re, os

          TARGET = '1.9.25'
          patched = []

          for root, dirs, files in os.walk('android'):
              for fname in files:
                  if not fname.endswith('.gradle'):
                      continue
                  path = os.path.join(root, fname)
                  try:
                      with open(path, 'r') as f:
                          content = f.read()
                      original = content

                      # Pattern 1: kotlinVersion = "x.x.x"
                      content = re.sub(
                          r'(kotlinVersion\s*=\s*)["\'][\d.]+["\']',
                          f'\\g<1>"{TARGET}"', content)
                      # Pattern 2: kotlin-gradle-plugin:x.x.x
                      content = re.sub(
                          r'(kotlin[:\-]gradle[:\-]plugin:)[\d.]+',
                          f'\\g<1>{TARGET}', content)
                      # Pattern 3: id("org.jetbrains.kotlin.*") version "x.x.x"
                      content = re.sub(
                          r'(id\s*\(["\']org\.jetbrains\.kotlin[^"\']*["\']\)\s*version\s*)["\'][\d.]+["\']',
                          f'\\g<1>"{TARGET}"', content)
                      # Pattern 4: kotlin("android") version "x.x.x"
                      content = re.sub(
                          r'(kotlin\s*\(["\']android["\']\)\s*version\s*)["\'][\d.]+["\']',
                          f'\\g<1>"{TARGET}"', content)

                      if content != original:
                          patched.append(path)
                          with open(path, 'w') as f:
                              f.write(content)
                  except Exception as e:
                      print(f"Error: {path}: {e}")

          print(f"Patched {len(patched)} files: {patched}")

          # gradle.properties override
          with open('android/gradle.properties', 'a') as f:
              f.write('\nkotlin.version=1.9.25\n')
          print("gradle.properties updated")
          PYEOF

          # Gradle init script - KGP'yi 1.9.25'e zorla (nuclear option)
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-kotlin.gradle << 'GRADLE_EOF'
          allprojects {
              buildscript {
                  configurations.all {
                      resolutionStrategy.eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin') {
                              details.useVersion '1.9.25'
                          }
                      }
                  }
              }
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.9.25'
                      }
                  }
              }
          }
          GRADLE_EOF

          echo "=== Kotlin lines after patch ==="
          grep -n "kotlin\|Kotlin" android/build.gradle || true

      # ─── Gradle cache (temiz key ile) ────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-kotlin125-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gradle-kotlin125-

      # ─── Gradlew izinleri ─────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ─── APK Build ────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PkotlinVersion=1.9.25
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      # ─── APK bilgisi ──────────────────────────────────────────────
      - name: Show APK size
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "✅ APK hazır: $(du -sh $APK | cut -f1)"
          else
            echo "❌ APK bulunamadı" && exit 1
          fi

      # ─── APK artifact olarak yükle ────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAP-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ─── Build özeti ──────────────────────────────────────────────
      - name: Build summary
        if: success()
        run: |
          echo "## ✅ Android APK Hazır!" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** #${{ github.run_number }} | **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK indirmek için: **Actions** sekmesi → bu çalışma → **Artifacts**" >> $GITHUB_STEP_SUMMARY
